name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  docker-smoke-test:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t oficina-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t oficina-frontend:ci .

      - name: Boot backend and check /health
        run: |
          docker run -d --name backend-smoke -p 3001:3001 oficina-backend:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 2
          done
          echo "backend never became healthy"
          docker logs backend-smoke
          exit 1

      - name: Boot frontend and check /
        run: |
          docker run -d --name frontend-smoke -p 3000:3000 oficina-frontend:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "frontend never became healthy"
          docker logs frontend-smoke
          exit 1
